name: Agent image

# Build-only check for the sandcastle agent container image. Proves `.sandcastle/Dockerfile`
# (node:22-bookworm + gh + corepack/pnpm + Claude Code CLI + the mattpocock-skills plugin +
# the Solana CLI) builds and holds what the runner needs. This is not the runner itself;
# that is agent-implement.yml, which pulls the prebuilt image this checks.

on:
  pull_request:
    paths:
      - '.sandcastle/**'
      - '.github/workflows/agent-image.yml'
  workflow_dispatch:

jobs:
  build-image:
    name: Build sandcastle agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Docker is preinstalled on ubuntu-latest GitHub-hosted runners.
      # `sandcastle docker build-image` builds .sandcastle/Dockerfile,
      # defaulting the AGENT_UID/AGENT_GID build args to the runner's uid/gid.
      # The default image name is `sandcastle:<repo-dir>`, here `sandcastle:toon`.
      - name: Build agent image
        run: npx --yes @ai-hero/sandcastle@0.12.0 docker build-image

      - name: Report agent image size
        run: docker image inspect sandcastle:toon --format '{{.Size}} bytes ({{.Id}})'

      # No-regression guard (toon-protocol/toon#117): fails if the image grows beyond
      # the frozen baseline + tolerance. No-ops until gate-baseline.json's
      # dockerImageSize.bytes is filled in from a real run's measured size.
      - name: Gate performance no-regression guard (image size)
        run: |
          bytes=$(docker image inspect sandcastle:toon --format '{{.Size}}')
          npx tsx .sandcastle/gate-guard-cli.ts image-size "$bytes"

      - name: Verify toolchain inside image
        run: |
          docker run --rm --entrypoint bash sandcastle:toon -lc '
            set -e
            node --version
            gh --version | head -1
            # pnpm resolves via corepack; the mounted repo pins pnpm@8.15.9
            # through its packageManager field.
            corepack --version
            pnpm --version | grep -E "^8\.15\."
            test "$(whoami)" = "agent"
            test -x /home/agent/.local/bin/claude
            # The runner starts every session with a mattpocock-skills slash command.
            claude plugin list | grep -q mattpocock-skills
            # `-lc` is a LOGIN shell on purpose: it rebuilds PATH from /etc/profile,
            # dropping anything set only via `ENV PATH`. That is the strictest mode
            # this container sees.
            solana --version
            solana-test-validator --version | grep -F 2.1.21
          '
