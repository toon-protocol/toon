name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # `gh api` reads this run's change set for the settlement-surface decision
    # in the last step; every other step here is checkout + pnpm. Declared
    # explicitly rather than inherited, as gate-regression-guard already does.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Consumed by the solana-settlement-proof job's `if:` AND asserted by
      # ci-ok, which pairs this decision with that job's result so a skipped
      # proof can only ever mean "a decision that RAN said the surface was
      # untouched" (toon#216).
      settlement_surface_touched: ${{ steps.settlement-surface.outputs.touched }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      # lint has no dependency on the build output, so run it in the
      # background while `pnpm -r build` (core -> sdk, topologically
      # ordered) runs in the foreground, then block on lint's exit code.
      # `wait` returns lint's exit status, and run steps already execute
      # under `bash -eo pipefail`, so a lint failure still fails the step.
      - name: Lint & build (overlapped)
        run: |
          pnpm lint &
          lint_pid=$!
          pnpm -r build
          wait "$lint_pid"

      # Typecheck is a HARD gate at zero errors (toon-protocol/toon#144).
      # #126-#142 cleared all 246 baseline errors but nothing in the gate
      # checked the result, so a reintroduced error would have merged silently.
      # `tsc --noEmit` exits non-zero on any error, so this step FAILS the
      # build -- it is not advisory. It must run AFTER `pnpm -r build`: the
      # root tsconfig resolves cross-package imports (@toon-protocol/core,
      # @toon-protocol/settlement-digest) through each package's published
      # `types` entry under dist/, so typechecking a clean checkout without
      # dist/ produces ~90 phantom TS2307s.
      #
      # This lives as a step in the `build` job rather than a separate job
      # deliberately: it mirrors how `lint` is wired (also a step here, also
      # genuinely blocking), it reuses the install + build this job already
      # paid for, and it keeps the run's summed runner-seconds inside the
      # frozen .sandcastle/gate-baseline.json budget that the
      # `gate-regression-guard` job enforces. That guard already lists
      # `build` in its `needs:`, so this check is registered with the
      # aggregator by construction -- a typecheck failure fails `build`,
      # which skips `gate-regression-guard`, which fails the run.
      - name: Typecheck
        run: pnpm typecheck

      # Blocking gate (toon-protocol/toon#169): `pnpm format:check` existed as
      # a script but was never referenced anywhere in this workflow, so no PR
      # had ever had to pass it and 15 files on `main` were already flagged
      # before this step was added (repaired in a separate commit on the same
      # PR). A step in `build` for the same reasons as Typecheck above --
      # `build` is gated by `CI OK`, and this reuses the job's install.
      #
      # The glob (`packages/*/src/**/*.ts`, package.json) deliberately covers
      # no `**/*.md` and nothing outside `packages/*/src`; widening it is a
      # separate decision with its own argument, not a drive-by of this
      # gate's wiring.
      - name: Format check
        run: pnpm format:check

      - name: Gate correctness no-regression guard (lint ceiling)
        run: npx tsx .sandcastle/gate-guard-cli.ts lint-ceiling

      # packages/* test suites are independent vitest processes (each package's
      # own dependencies are already built above); running them concurrently
      # instead of one-at-a-time cuts wall-clock at no extra runner-job cost.
      - run: pnpm -r --parallel test --if-present

      # pnpm -r excludes the workspace root by default, so the root-level
      # .sandcastle/*.test.ts guard tests never run under `pnpm -r test`.
      #
      # This is the one command in the gate that loads the ROOT
      # vitest.config.ts, so it is also where the root config's own state is
      # checked (toon-protocol/toon#144). `.sandcastle/vitest-config-parity.test.ts`
      # asserts the root config applies every `test.env` var the per-package
      # configs set; because it executes under the root config, its
      # `process.env` IS that config's effective environment. A vitest failure
      # exits non-zero, so this step BLOCKS -- it does not warn -- and the
      # workflow triggers on `pull_request`, so the check runs before merge
      # rather than after it.
      #
      # Deliberately a step in `build` rather than a new job, for the same
      # reasons as the Typecheck step above: `gate-regression-guard` already
      # lists `build` in its `needs:`, so this is registered with the
      # aggregator by construction, and it reuses this job's install. Widened
      # from the single gate-guard.test.ts file to the whole directory so new
      # .sandcastle guards are picked up automatically; the added parity file
      # costs ~0.1s.
      - name: Gate guard unit tests (incl. root vitest config parity)
        run: npx vitest run .sandcastle/

      - name: connector-contract-canary
        run: |
          pnpm --filter @toon-protocol/sdk test:integration tests/integration/connector-contract.test.ts tests/integration/connector-contract.multichain.test.ts
          pnpm --filter @toon-protocol/sdk exec tsc -p tests/integration/tsconfig.json

      # Decides whether the solana-settlement-proof job below must run for this
      # change set (toon#216). It lives as a step in an existing job rather than
      # a job of its own on purpose: a new always-on job costs ~10 runner-seconds
      # against a summed-runner-second ceiling whose worst recent run sits ~8%
      # under it, and this costs about a second inside an install this job has
      # already paid for.
      #
      # The decision is a tested module (.sandcastle/settlement-surface.ts), not
      # a workflow `paths:` filter, because a filter cannot gate a JOB, cannot
      # fail safe, and cannot be unit-tested. Any failure here -- a `gh api`
      # error, a missing change set -- fails this step and therefore `CI OK`;
      # an UNENUMERABLE change set decides `true` and runs the proof. There is
      # no path on which "we could not tell" silently skips it.
      - name: Decide whether this change touches the Solana settlement surface
        id: settlement-surface
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          CHANGED="${RUNNER_TEMP:-/tmp}/ci-changed-files.txt"
          case "$EVENT_NAME" in
            pull_request)
              gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > "$CHANGED"
              ;;
            push)
              # An all-zero `before` is a branch's first push: there is no
              # previous commit to diff against, so fall through to the
              # fail-safe sentinel rather than guessing.
              if [ -z "${PUSH_BEFORE:-}" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo '__UNKNOWN__' > "$CHANGED"
              else
                gh api "repos/$REPO/compare/$PUSH_BEFORE...$PUSH_AFTER" --paginate --jq '.files[]?.filename' > "$CHANGED"
              fi
              ;;
            *)
              echo '__UNKNOWN__' > "$CHANGED"
              ;;
          esac
          npx tsx .sandcastle/settlement-surface-cli.ts "$CHANGED"

  devbox-validate:
    name: Devbox Environment Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Assert tool versions
        run: |
          cat > "${RUNNER_TEMP:-/tmp}/assert-versions.sh" <<'ASSERT'
          set -euo pipefail
          node --version | grep -E '^v22\.'
          pnpm --version | grep -E '^8\.15\.'
          ASSERT
          devbox run -- bash "${RUNNER_TEMP:-/tmp}/assert-versions.sh"
          echo "✅ All devbox tools resolved at expected versions"

      - name: Smoke build
        run: devbox run -- bash -c "pnpm install --no-frozen-lockfile && pnpm build"

  gate-regression-guard:
    name: Gate speed/performance no-regression guard
    needs: [build, devbox-validate]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      # Reads THIS ATTEMPT's own build + devbox-validate job timings (not a
      # recomputed/live threshold) and compares them against the frozen
      # .sandcastle/gate-baseline.json averages, so the same commit always
      # earns the same verdict.
      #
      # toon#151: the attempt is addressed explicitly (`/attempts/<n>/jobs`
      # plus a run_attempt filter in the CLI) rather than relying on the bare
      # `/jobs` endpoint's default of "latest attempt". Note that "Re-run
      # failed jobs" carries the untouched jobs' ORIGINAL timings into the new
      # attempt -- correctly, since they did not re-run. Only "Re-run all
      # jobs" produces fresh measurements.
      - name: Fetch this attempt's job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" > /tmp/gate-guard-jobs.json

      - name: Gate speed/performance no-regression guard
        env:
          # This job measures the run's WORK, not itself.
          GATE_GUARD_SELF_JOB_NAME: Gate speed/performance no-regression guard
          GATE_GUARD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: npx tsx .sandcastle/gate-guard-cli.ts speed-performance /tmp/gate-guard-jobs.json

  # Validates a changeset's release plan BEFORE merge (toon#219). Until now
  # nothing in this repo read a changeset pre-merge: `changeset` only appeared
  # inside release.yml's `version:`/`publish:` inputs, which run AFTER merge
  # to `main`, where a failure gates nothing. toon-client#611 is the proof of
  # what that misses -- a changeset naming both an ignored and a non-ignored
  # package is a hard `changeset version` error, and toon-client's `release.yml`
  # went red on every push to `main` for a day, with FIVE mixed changesets
  # piled up behind the first because `changeset version` stops at the first
  # offender.
  #
  # `if: github.event_name == 'pull_request'`, not a step inside `build`: this
  # command MUTATES the tree (bumps package.json versions, writes CHANGELOGs),
  # and `build`'s own "Format check" step re-checks package.json against
  # prettier in that same job (ci.yml:71-83) -- running the mutation there
  # would make that step check output THIS step just wrote instead of what the
  # PR author wrote. A separate job's checkout is a throwaway that publishes
  # nothing, so the mutation is free, and it cannot bleed into a sibling step.
  # Skipped on `push` (post-merge) on purpose -- validating a release plan
  # after the merge that plan describes gates nothing, same reasoning as why
  # this existed as a post-merge-only check in the first place.
  #
  # Assertion is `pnpm changeset version` -- the byte-identical command
  # release.yml's `changesets/action` runs as its `version:` input, so green
  # here means the release gets past versioning with no second implementation
  # to drift (verified locally: a changeset naming a nonexistent package exits
  # 1 with `Found changeset ... which is not in the workspace`; the current,
  # unmodified changeset set exits 0 as a no-op). `git diff --stat` afterward
  # makes "which packages would this release move" visible on every PR.
  changeset:
    name: Changeset validates a release plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Assert the changesets form a valid release plan
        run: |
          set -euo pipefail
          pnpm changeset version
          echo "--- the release plan this PR would produce ---"
          git --no-pager diff --stat

  # Fleet no-op merge guard (toon-meta#405), wired INTO this repo's aggregate
  # required check so that it blocks a HUMAN merge and not just the fleet
  # auto-merge pass (toon-meta#408). connector#1008 merged green, closed its
  # ticket and changed zero files -- and it was a human who merged it, because
  # a red NON-required check is only a warning on the merge button. This
  # replaces the stand-alone empty-pr-guard-shim.yml, deleted in the same
  # commit; running both would put two identical "No-op merge guard" check
  # runs on every PR. Canonical caller snippet and full rationale:
  # toon-meta scripts/factory/empty-pr-guard-gate-job.yml.
  #
  # No `secrets: inherit` -- the guard makes no API call and no write of any
  # kind, so handing it FACTORY_OPS_TOKEN would widen a monitored credential
  # for nothing. No `if:` either: this workflow also runs on push, where the
  # guard passes with a plain "no merge result to evaluate"; a job-level `if:`
  # would make it `skipped` there, and a skipped gating job must never read as
  # a pass (toon-meta#279).
  no-op-merge:
    uses: toon-protocol/toon-meta/.github/workflows/empty-pr-guard.yml@main

  # Solana settlement redemption proof (toon#215), moved here from its own
  # stand-alone workflow and wired into the aggregate by toon#216. That
  # workflow is deleted in the same commit -- running both would put two
  # identical proof jobs on every settlement PR.
  #
  # WHY IT MOVED: `CI OK` is this repo's only required status context, so a
  # proof outside the aggregate blocks nothing. It could go red, or stop
  # running, and a merge would still go through. The defect it guards
  # (toon#214: a claim signed over a message nothing on chain verifies)
  # silently produced bundles that could never redeem, which makes this the
  # guard least able to afford being optional.
  #
  # WHY IT IS CONDITIONAL: ~90s of runner time on every PR, for a proof that
  # can only speak about the settlement surface. It runs when the change set
  # touches that surface, decided by the `build` job's last step; on every
  # other PR it is `skipped` and ci-ok requires that skip to be paired with a
  # decision of `false`. It is NOT folded into the frozen
  # .sandcastle/gate-baseline.json figures -- see that file's
  # gatePerformance.conditionalJobs.solanaSettlementProof for the measured
  # cost (89-94s) and why excluding it beats raising the ceiling 55%.
  #
  # `timeout-minutes` is this job's own cost gate, since the guard job finishes
  # before this one does and cannot measure it. A hung validator fails the job,
  # and therefore `CI OK`, in minutes.
  solana-settlement-proof:
    name: Solana settlement redemption proof
    needs: [build]
    # `needs: [build]` already requires build to have succeeded; the surface
    # decision is the additional condition. A false here reports `skipped`,
    # which ci-ok accepts ONLY against a `false` decision.
    if: needs.build.outputs.settlement_surface_touched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      # Restored BEFORE the installer so a warm cache skips the download
      # entirely. Keyed on the exact version — a version bump must miss.
      - name: Cache Solana CLI
        id: solana-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: solana-cli-${{ runner.os }}-v2.1.21

      # v2.1.21, NOT the v3.x line, and load-bearing rather than conservatism:
      # v3's `solana-test-validator` hard-requires io_uring, which is unavailable
      # under some sandboxed runners (connector's and swap's gates pin the same
      # version for the same reason). It also matches the `=2.1.0`
      # solana-program pin the vendored `payment_channel.so` was built against.
      - name: Install Solana CLI
        if: steps.solana-cli-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"

      - name: Put Solana CLI on PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # Fail here with a clear message rather than 90s later inside a test.
      - name: Assert Solana toolchain
        run: |
          solana --version
          solana-test-validator --version

      - run: pnpm install --no-frozen-lockfile

      # The integration config imports the SDK from source, but core /
      # settlement-digest resolve through their dist entry points.
      - run: pnpm -r build

      # SDK_REQUIRE_SOLANA=1 turns "validator not available" from a skip into a
      # hard failure. Without it this job could report success having run
      # nothing, which is the exact defect swap#106/#160 found twice.
      - name: Redeem a claim on a local validator
        env:
          SDK_REQUIRE_SOLANA: '1'
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          pnpm --filter @toon-protocol/sdk test:integration \
            tests/integration/solana-claim-redeem.integration.test.ts 2>&1 \
            | tee /tmp/solana-proof.log

      # A green tick is not evidence that anything ran. The suite must have
      # collected its full complement AND printed the on-chain state transition
      # its successful redemption logs.
      - name: Assert the proof actually redeemed something on chain
        run: |
          set -euo pipefail
          sed -r 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/solana-proof.log > /tmp/solana-proof.plain
          if ! grep -qE 'Tests +5 passed \(5\)' /tmp/solana-proof.plain; then
            echo "FAIL: expected 5 passing tests in the Solana redemption proof."
            echo "A test that stopped running is the failure mode this job exists to prevent."
            exit 1
          fi
          if ! grep -q '\[solana-redeem\] tx ' /tmp/solana-proof.plain; then
            echo "FAIL: no on-chain redemption was logged — nothing moved a channel account."
            exit 1
          fi
          grep '\[solana-redeem\]' /tmp/solana-proof.plain

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [build, devbox-validate, gate-regression-guard, no-op-merge, solana-settlement-proof, changeset]
    if: always()
    steps:
      # Fleet-wide aggregate required check per toon-meta#279: this single job
      # is the repo's required status, so a skipped or cancelled gating job
      # must never read as a pass. All four unconditional jobs are expected to
      # run on every run of this workflow -- gate-regression-guard only skips
      # when a dependency failed, which must fail the aggregate anyway.
      # Anything other than 'success' (failure, cancelled, skipped) fails this
      # job. The conditional Solana proof is evaluated separately below.
      - name: Require every gating job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEVBOX_RESULT: ${{ needs.devbox-validate.result }}
          GATE_RESULT: ${{ needs.gate-regression-guard.result }}
          NO_OP_MERGE_RESULT: ${{ needs.no-op-merge.result }}
        run: |
          echo "build: $BUILD_RESULT"
          echo "devbox-validate: $DEVBOX_RESULT"
          echo "gate-regression-guard: $GATE_RESULT"
          echo "no-op-merge: $NO_OP_MERGE_RESULT"
          if [ "$BUILD_RESULT" != "success" ] || [ "$DEVBOX_RESULT" != "success" ] || [ "$GATE_RESULT" != "success" ] || [ "$NO_OP_MERGE_RESULT" != "success" ]; then
            echo "CI not OK: at least one gating job did not succeed (skipped/cancelled counts as failure)."
            exit 1
          fi
          echo "CI OK: all unconditional gating jobs succeeded."

      # The conditional half (toon#216). A bare `needs:` on a conditional job
      # blocks NOTHING: a job skipped by its own `if:` reports `skipped`, and a
      # required check that reads a skip as a pass is not a gate. So the skip is
      # only accepted against the decision that produced it -- `build`'s
      # settlement-surface output, which comes from a step that RAN.
      #
      # Three outcomes, no fourth:
      #   decision true  -> the proof must have SUCCEEDED. failure, cancelled
      #                     and skipped all fail the aggregate.
      #   decision false -> skipped (normal) or success (someone re-ran it by
      #                     hand) are both fine.
      #   anything else  -> `build` succeeded without emitting a decision, i.e.
      #                     the wiring is broken. Fail: an unreadable decision
      #                     must never be the reason the proof was skipped.
      - name: Require the Solana settlement proof for changes that touch it
        env:
          SETTLEMENT_TOUCHED: ${{ needs.build.outputs.settlement_surface_touched }}
          PROOF_RESULT: ${{ needs.solana-settlement-proof.result }}
        run: |
          echo "settlement surface touched: '$SETTLEMENT_TOUCHED'"
          echo "solana-settlement-proof: $PROOF_RESULT"
          case "$SETTLEMENT_TOUCHED" in
            true)
              if [ "$PROOF_RESULT" != "success" ]; then
                echo "CI not OK: this change touches the Solana settlement surface, so the redemption proof must pass, and it reported '$PROOF_RESULT' (skipped/cancelled counts as failure)."
                exit 1
              fi
              echo "CI OK: the Solana settlement redemption proof passed on a change that touches it."
              ;;
            false)
              if [ "$PROOF_RESULT" != "skipped" ] && [ "$PROOF_RESULT" != "success" ]; then
                echo "CI not OK: the Solana settlement proof reported '$PROOF_RESULT'."
                exit 1
              fi
              echo "CI OK: this change touches no Solana settlement surface; the proof was correctly '$PROOF_RESULT'."
              ;;
            *)
              echo "CI not OK: the settlement-surface decision reported '$SETTLEMENT_TOUCHED', which is neither 'true' nor 'false' — the build job succeeded without deciding whether the Solana proof was required, so its skip cannot be trusted."
              exit 1
              ;;
          esac

      # toon#219. `changeset` skips itself on `push` (its own `if:`), so a bare
      # `needs:` would let that skip read as a pass on every event -- the same
      # skipped-required-check trap toon#209 and toon#216 hit. Here the
      # "decision" needing no separate step or module is `github.event_name`
      # itself: this workflow only ever fires on `pull_request` or `push` to
      # `main` (ci.yml:3-6), both already read directly off `github` context,
      # so there is nothing bespoke to compute or fail-safe the way the Solana
      # surface decision above has to.
      - name: Require the changeset job to have validated the release plan on a pull request
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGESET_RESULT: ${{ needs.changeset.result }}
        run: |
          echo "event: $EVENT_NAME"
          echo "changeset: $CHANGESET_RESULT"
          case "$EVENT_NAME" in
            pull_request)
              if [ "$CHANGESET_RESULT" != "success" ]; then
                echo "CI not OK: this is a pull request, so the changeset job must validate the release plan, and it reported '$CHANGESET_RESULT' (skipped/cancelled counts as failure)."
                exit 1
              fi
              echo "CI OK: the changeset job validated the release plan."
              ;;
            push)
              if [ "$CHANGESET_RESULT" != "skipped" ] && [ "$CHANGESET_RESULT" != "success" ]; then
                echo "CI not OK: the changeset job reported '$CHANGESET_RESULT' on a push, where it should have been skipped."
                exit 1
              fi
              echo "CI OK: this is a push, not a pull request; the changeset job was correctly '$CHANGESET_RESULT'."
              ;;
            *)
              echo "CI not OK: unrecognized event '$EVENT_NAME' — the changeset job's required/skip state cannot be trusted."
              exit 1
              ;;
          esac
